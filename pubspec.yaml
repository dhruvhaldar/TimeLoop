name: timeloop
description: "A cross-platform stopwatch and interval reminder app."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.3.9
  sqflite: ^2.3.3+1
  flutter_local_notifications: ^17.1.2
  path: ^1.9.0
  path_provider: ^2.1.3
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  uses-material-design: true
